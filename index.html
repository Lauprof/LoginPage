<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="row border rounded shadow ">
            <div class="col-md-6 bg-success text-white">
                <div class="d-flex flex-column justify-content-center align-items-center h-100 p-3">
                    <img src="static\MUT.png" alt="University Logo" class="img-fluid border rounded-circle mb-3" style="width: 150px; height: 150px;">
                    <p class="fw-bold">Murang'a University of Science and Technology</p>
                    <p class="fst-italic">Innovation for prosperity</p>
                </div>

           
            </div>
            <div class="col-md-6 p-3 bg-white">
              <p class="fw-bold">Welcome Back</p>
              <p class="text-muted">Sign in to access your student portal</p>
                <form>
                        <div class="p-3">
                            <label for="username" class="form-label fw-bold">Student Number</label>
                            <div class="input-group shadow">
                                <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                                <input type="text" class="form-control" id="username" name="username" required placeholder="Enter your student number">
                            </div>
                        </div>
                        <div class="p-3">
                            <label for="password" class="form-label fw-bold">Password</label>
                            <div class="input-group shadow">
                                <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 p-3 shadow"><i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Sign in</button>
                    </form>  

                    <p class="text-center text-decoration-underline d-block p-3">or</p>

        <div class="d-flex align-items-center justify-content-around">

        <div>
         <a href="register.html" class="mb-3 text-decoration-none text-success"><i class="bi bi-person-plus me-1" aria-hidden="true"></i>Join University</a>
         </div>
        <div>
            <a href="forgot-password.html" class="text-decoration-none mb-3 text-success"><i class="bi bi-key me-1" aria-hidden="true"></i>Forgot Password?</a>   
        </div>

        </div>

        <p class="text-center lead text-muted fs-6 p-3">© 2023 Murang'a University of Science and Technology. All rights reserved.</p>
        </div>


 
</div>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
</body>
</html>
